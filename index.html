<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142747">
  <title>Betta & Co. | สแกนบาร์โค้ด</title>
  <style>
    :root{--navy:#142747;--ink:#202b3b;--muted:#718096;--line:#e4eaf0;--bg:#f3f6fa;--white:#fff;--red:#a23b35;--green:#28724e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans Thai",sans-serif}.wrap{width:min(100% - 26px,620px);margin:20px auto}.brand{background:var(--navy);color:white;padding:16px 18px;border-radius:15px;display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border:1px solid #ffffff80;border-radius:50%;display:grid;place-items:center;font-size:22px}.brand b{font:600 18px Georgia,serif}.brand small{display:block;color:#cbd6e4;font-size:11px}.panel{margin-top:14px;background:white;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 10px 28px #14274712}h1{font-size:20px;margin:0 0 5px}p{margin:0;color:var(--muted);font-size:13px}.video-wrap{position:relative;margin-top:16px;background:#101820;border-radius:13px;overflow:hidden;min-height:220px;display:grid;place-items:center}.video-wrap video{width:100%;max-height:62vh;object-fit:cover;display:none}.placeholder{color:#d7e0eb;text-align:center;padding:35px 20px}.actions{display:flex;gap:9px;margin-top:14px}.btn{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer}.btn.secondary{background:#edf2f7;color:#263a52}.btn:disabled{opacity:.55}.input{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit;font-size:16px}.result{margin-top:12px;border-radius:10px;padding:12px;background:#eaf5ed;color:var(--green);display:none;overflow-wrap:anywhere}.error{margin-top:12px;border-radius:10px;padding:12px;background:#fff0ee;color:var(--red);display:none;overflow-wrap:anywhere}.hint{font-size:11px;margin-top:13px;color:var(--muted)}
  </style>
</head>
<body><main class="wrap">
  <header class="brand"><div class="mark">🐟</div><div><b>Betta &amp; Co.</b><small>เครื่องมือสแกนบาร์โค้ด</small></div></header>
  <section class="panel">
    <h1>สแกนบาร์โค้ดสินค้า</h1><p>วางบาร์โค้ดให้อยู่ในกรอบกล้อง ระบบจะอ่านและส่งรหัสกลับไปยังหน้าสต๊อก</p>
    <div class="video-wrap"><video id="video" playsinline muted></video><div class="placeholder" id="placeholder">กด “เปิดกล้อง” แล้วอนุญาตให้เว็บใช้กล้อง</div></div>
    <div class="actions"><button class="btn" id="start">เปิดกล้อง</button><button class="btn secondary" id="stop" disabled>ปิดกล้อง</button></div>
    <input class="input" id="manual" inputmode="numeric" placeholder="หรือพิมพ์บาร์โค้ดเอง">
    <div class="actions"><button class="btn secondary" id="send">ส่งรหัสกลับหน้าสต๊อก</button></div>
    <div class="result" id="result"></div><div class="error" id="error"></div>
    <p class="hint">ต้องเปิดหน้านี้ผ่าน HTTPS และอนุญาตกล้องในเบราว์เซอร์ หากกลับไปหน้าสต๊อกแล้วไม่พบรหัส ให้เปิด scanner จากปุ่มในหน้าสต๊อกอีกครั้ง</p>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const nonce=params.get('nonce')||'';const parentOrigin=params.get('parentOrigin')||'';let stream=null,detector=null,raf=0,sending=false;
function message(text){$('error').textContent=text;$('error').style.display='block'}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('video').style.display='none';$('placeholder').style.display='block';$('start').disabled=false;$('stop').disabled=true}
async function start(){ $('error').style.display='none';if(!('BarcodeDetector'in window)){message('เบราว์เซอร์นี้ไม่รองรับตัวอ่านบาร์โค้ด ใช้ช่องพิมพ์ด้านล่างหรือเปิดด้วย Chrome เวอร์ชันล่าสุด');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('video');v.srcObject=stream;v.style.display='block';$('placeholder').style.display='none';await v.play();detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});$('start').disabled=true;$('stop').disabled=false;scan()}catch(e){let msg=e.name==='NotAllowedError'?'เบราว์เซอร์ไม่อนุญาตกล้อง ตรวจสิทธิ์กล้องของเว็บนี้ใน Chrome แล้วลองใหม่':e.name==='NotFoundError'?'ไม่พบกล้องบนอุปกรณ์นี้':(e.message||'เปิดกล้องไม่สำเร็จ');message(msg)}}
async function scan(){if(!stream||sending)return;try{const codes=await detector.detect($('video'));if(codes.length){$('manual').value=codes[0].rawValue;send();return}}catch(e){}raf=requestAnimationFrame(scan)}
function send(){const barcode=$('manual').value.trim();if(!barcode){message('ยังไม่มีบาร์โค้ด กรุณาสแกนหรือพิมพ์รหัสก่อน');return}if(!nonce||!parentOrigin){message('ลิงก์ scanner ไม่ครบ กรุณาเปิดจากปุ่มกล้องในหน้าสต๊อก');return}if(!window.opener){message('ไม่พบหน้าสต๊อกต้นทาง กรุณากลับไปเปิด scanner จากปุ่มในหน้าสต๊อกใหม่');return}try{const o=new URL(parentOrigin);if(o.protocol!=='https:')throw new Error('origin is not secure');window.opener.postMessage({type:'BETTA_BARCODE',nonce,barcode},o.origin);sending=true;stop();$('result').textContent='ส่งบาร์โค้ด '+barcode+' กลับหน้าสต๊อกแล้ว คุณปิดแท็บนี้ได้';$('result').style.display='block';$('send').disabled=true}catch(e){message('ส่งรหัสกลับไม่ได้ กรุณาเปิด scanner จากหน้าสต๊อกอีกครั้ง')}}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);$('send').addEventListener('click',send);$('manual').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});window.addEventListener('pagehide',stop);
</script></body></html>
